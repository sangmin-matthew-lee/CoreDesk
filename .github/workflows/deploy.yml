name: Deploy CoreDesk to GCP

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/coredesk:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/coredesk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          # Create GCS bucket if it doesn't exist (using gsutil)
          gsutil mb -p ${{ secrets.GCP_PROJECT_ID }} -c standard -l us-central1 gs://coredesk-tfstate-${{ secrets.GCP_PROJECT_ID }} || true
          # Initialize terraform with dynamic backend configuration
          terraform init \
            -backend-config="bucket=coredesk-tfstate-${{ secrets.GCP_PROJECT_ID }}" \
            -backend-config="prefix=terraform/state"
        working-directory: ./terraform

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="gcp_project=${{ secrets.GCP_PROJECT_ID }}"
        working-directory: ./terraform

      - name: Get VM IP from Terraform
        id: tf-ip
        run: |
          IP=$(terraform output -raw public_ip)
          echo "vm_ip=$IP" >> $GITHUB_OUTPUT
        working-directory: ./terraform

      - name: Set up SSH Private Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          echo "Waiting for SSH port 22 to open on ${{ steps.tf-ip.outputs.vm_ip }}..."
          for i in {1..30}; do
            nc -zv -w5 ${{ steps.tf-ip.outputs.vm_ip }} 22 && break
            echo "SSH not ready yet, retrying in 5s... ($i/30)"
            sleep 5
          done

      - name: Copy deployment files to VM
        env:
          DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/coredesk:latest
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        run: |
          TARGET_DOMAIN="${DOMAIN_NAME:-geicrm.duckdns.org}"
          TARGET_EMAIL="${LETSENCRYPT_EMAIL:-admin@geicrm.duckdns.org}"

          # Create .env locally on runner
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}" > .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env
          echo "DOMAIN_NAME=${TARGET_DOMAIN}" >> .env
          echo "APP_URL=https://${TARGET_DOMAIN}" >> .env
          echo "LETSENCRYPT_EMAIL=${TARGET_EMAIL}" >> .env

          # Copy compose, env, and deploy script to VM
          scp -o StrictHostKeyChecking=no ./docker-compose.yml debian@${{ steps.tf-ip.outputs.vm_ip }}:~/docker-compose.yml
          scp -o StrictHostKeyChecking=no ./.env debian@${{ steps.tf-ip.outputs.vm_ip }}:~/.env
          scp -o StrictHostKeyChecking=no ./scripts/deploy.sh debian@${{ steps.tf-ip.outputs.vm_ip }}:~/deploy.sh

          # Set permissions and copy nginx templates to VM
          ssh -o StrictHostKeyChecking=no debian@${{ steps.tf-ip.outputs.vm_ip }} "chmod +x ~/deploy.sh && mkdir -p ~/nginx/templates"
          scp -o StrictHostKeyChecking=no -r ./nginx/templates/* debian@${{ steps.tf-ip.outputs.vm_ip }}:~/nginx/templates/

      - name: Deploy to VM via SSH
        run: |
          ssh -o StrictHostKeyChecking=no debian@${{ steps.tf-ip.outputs.vm_ip }} "bash ~/deploy.sh"

