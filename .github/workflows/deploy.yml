name: Deploy CoreDesk to GCP

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/coredesk:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/coredesk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          # Create GCS bucket if it doesn't exist (using gsutil)
          gsutil mb -p ${{ secrets.GCP_PROJECT_ID }} -c standard -l us-central1 gs://coredesk-tfstate-${{ secrets.GCP_PROJECT_ID }} || true
          # Initialize terraform with dynamic backend configuration
          terraform init \
            -backend-config="bucket=coredesk-tfstate-${{ secrets.GCP_PROJECT_ID }}" \
            -backend-config="prefix=terraform/state"
        working-directory: ./terraform

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="gcp_project=${{ secrets.GCP_PROJECT_ID }}"
        working-directory: ./terraform

      - name: Get VM IP from Terraform
        id: tf-ip
        run: |
          IP=$(terraform output -raw public_ip)
          echo "vm_ip=$IP" >> $GITHUB_OUTPUT
        working-directory: ./terraform

      - name: Set up SSH Private Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          echo "Waiting for SSH port 22 to open on ${{ steps.tf-ip.outputs.vm_ip }}..."
          for i in {1..30}; do
            nc -zv -w5 ${{ steps.tf-ip.outputs.vm_ip }} 22 && break
            echo "SSH not ready yet, retrying in 5s... ($i/30)"
            sleep 5
          done

      - name: Copy deployment files to VM
        run: |
          # Copy docker-compose.yml
          scp -o StrictHostKeyChecking=no ./docker-compose.yml debian@${{ steps.tf-ip.outputs.vm_ip }}:~/docker-compose.yml
          # Create nginx templates directory on VM
          ssh -o StrictHostKeyChecking=no debian@${{ steps.tf-ip.outputs.vm_ip }} "mkdir -p ~/nginx/templates"
          # Copy nginx templates to VM
          scp -o StrictHostKeyChecking=no -r ./nginx/templates/* debian@${{ steps.tf-ip.outputs.vm_ip }}:~/nginx/templates/

      - name: Deploy to VM via SSH
        run: |
          ssh -o StrictHostKeyChecking=no debian@${{ steps.tf-ip.outputs.vm_ip }} "
            set -e
            
            # Setup environment variables
            export DOMAIN_NAME='${{ secrets.DOMAIN_NAME }}'
            export LETSENCRYPT_EMAIL='${{ secrets.LETSENCRYPT_EMAIL }}'
            
            echo 'DOCKER_IMAGE_NAME=${{ secrets.DOCKER_HUB_USERNAME }}/coredesk:latest' > .env
            echo 'JWT_SECRET=${{ secrets.JWT_SECRET }}' >> .env
            echo \"DOMAIN_NAME=\$DOMAIN_NAME\" >> .env
            
            # Bootstrap SSL certificates using standalone Certbot if not present
            if ! sudo test -d "certbot/conf/live/$DOMAIN_NAME"; then
              echo "SSL Certificates not found for $DOMAIN_NAME. Bootstrapping via Certbot..."
              # Stop any running containers (like the old web container on port 80) to free the port
              sudo docker compose down || true
              # Run temporary standalone certbot to get certs
              sudo docker run --rm \
                -p 80:80 \
                -v $(pwd)/certbot/conf:/etc/letsencrypt \
                -v $(pwd)/certbot/www:/var/www/certbot \
                certbot/certbot certonly --standalone \
                --preferred-challenges http \
                --email $LETSENCRYPT_EMAIL \
                --agree-tos --no-eff-email \
                -d $DOMAIN_NAME \
                --keep-until-expiring -n
            fi
            
            # Pull new image
            sudo docker compose pull
            # Start/update the containers
            sudo docker compose up -d --remove-orphans
            # Prune old unused images to save disk space on e2-micro
            sudo docker image prune -f
          "

